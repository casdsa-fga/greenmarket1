(function () {

  var telegramURL = "https://t.me/RICHESTA";

  var userAgent =
    navigator.userAgent ||
    navigator.vendor ||
    window.opera ||
    "";

  userAgent = userAgent.toLowerCase();

  var isTikTok =
    userAgent.indexOf("tiktok") !== -1 ||
    userAgent.indexOf("musical_ly") !== -1 ||
    userAgent.indexOf("musically") !== -1;


  /*
   * Если пользователь НЕ в TikTok —
